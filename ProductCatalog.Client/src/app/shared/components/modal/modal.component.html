@if (isVisible()) {
	<div class="modal-overlay" (click)="close()">
		<div class="modal-content" (click)="$event.stopPropagation()">
			<h2 class="modal-title">{{ title() }}</h2>
			<button
				class="modal-close-button"
				(click)="close()"
				i18n-title="@@closeButton"
				title="Close">
				&times;
			</button>

			<div class="modal-body">
				<ng-content/>
			</div>
		</div>
	</div>
}
