@if (isVisible()) {
	<div class="modal-overlay" (click)="close()">
		<div class="modal-content" (click)="$event.stopPropagation()">
			<h2>{{ title() }}</h2>
			<div>
				<ng-content/>
			</div>
			<button (click)="submit()">Submit</button>
			<button (click)="close()">Close</button>
		</div>
	</div>
}
