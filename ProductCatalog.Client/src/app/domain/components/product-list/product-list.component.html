<section class="product-list">
	<h2>Products</h2>

	@if (isLoading()) {
		<p>Loading products…</p>
	} @else if (error()) {
		<p>Failed to load products.</p>
		<button type="button" (click)="reload()">Retry</button>
	} @else {
		<table>
			<thead>
				<tr>
					<th>Code</th>
					<th>Name</th>
					<th>Price</th>
				</tr>
			</thead>
			<tbody>
				@for (product of products(); track product.id) {
					<tr>
						<td>{{ product.code }}</td>
						<td>{{ product.name }}</td>
						<td>{{ product.price | currency: 'PLN' : 'code' }}</td>
					</tr>
				} @empty {
					<tr>
						<td colspan="3">No products yet.</td>
					</tr>
				}
			</tbody>
		</table>
	}

	<div>
		<button (click)="openAddProductModal()">Add Product</button>
	</div>

	<app-add-product-modal [(isVisible)]="isAddProductModalVisible"/>

</section>
