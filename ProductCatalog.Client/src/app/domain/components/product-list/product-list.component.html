<section class="product-list">
	<h2 i18n="@@productCatalog">Product Catalog</h2>

	@if (isLoading()) {
		<p i18n="@@loadingProducts">Loading products…</p>
	} @else if (error()) {
		<p i18n="@@failedLoadProducts">Failed to load products.</p>
		<button class="app-button" type="button" (click)="reload()" i18n="@@retryButton">Retry</button>
	} @else {
		<table class="app-table product-list-table">
			<thead>
				<tr>
					<th i18n="@@tableHeaderName">Name</th>
					<th i18n="@@tableHeaderCode">Code</th>
					<th i18n="@@tableHeaderPrice">Price</th>
				</tr>
			</thead>
			<tbody>
				@for (product of products(); track product.id) {
					<tr>
						<td>{{ product.name }}</td>
						<td>{{ product.code }}</td>
						<td>{{ product.price | currency: 'PLN' }}</td>
					</tr>
				} @empty {
					<tr>
						<td colspan="3" i18n="@@noProducts">No products yet.</td>
					</tr>
				}
			</tbody>
		</table>
	}

	<div class="app-button-group">
		<button
			class="app-button app-primary-button"
			(click)="openAddProductModal()" i18n="@@addProductButton">
			Add Product
		</button>
	</div>

	<app-add-product-modal [(isVisible)]="isAddProductModalVisible"/>

</section>
