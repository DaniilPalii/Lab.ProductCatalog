<app-modal
	i18n-title="@@addProductTitle"
	title="Add Product"
	[(isVisible)]="isVisible"
	(close)="close()">

	<form class="add-product-form" [formGroup]="form" (ngSubmit)="submit()">

		<div class="form-row">
			<label for="name" class="form-label" i18n="@@labelName">Name</label>
			<input id="name" class="app-input" formControlName="name" required />
		</div>

		<div class="form-row">
			<label for="code" class="form-label" i18n="@@labelCode">Code</label>
			<input id="code" class="app-input" formControlName="code" required />
		</div>

		<div class="form-row">
			<label for="price" class="form-label" i18n="@@labelPrice">Price</label>
			<input id="price" class="app-input" formControlName="price" type="number" required />
		</div>

		@if (saveError()) {
			<p class="save-error">{{ saveError() }}</p>
		}

		<div class="app-button-group">
			<button class="app-button app-primary-button" type="submit" [disabled]="isSaving() || form.invalid">
				{{ addButtonLabel }}
			</button>

			<button class="app-button" (click)="close()" i18n="@@cancelButton">
				Cancel
			</button>
		</div>
	</form>
</app-modal>
