<app-modal
	title="Add Product"
	[(isVisible)]="isVisible"
	(close)="close()"
>
	<form [formGroup]="form" (ngSubmit)="submit()">
		<input
			formControlName="code"
			placeholder="Code"
			required
		/>
		<input
			formControlName="name"
			placeholder="Name"
			required
		/>
		<input
			formControlName="price"
			type="number"
			placeholder="Price"
			required
		/>

		@if (saveError()) {
			<p>{{ saveError() }}</p>
		}

		<div>
			<button type="submit" [disabled]="isSaving()">
				{{ isSaving() ? 'Saving…' : 'Add' }}
			</button>
			<button (click)="close()">Cancel</button>
		</div>
	</form>
</app-modal>
