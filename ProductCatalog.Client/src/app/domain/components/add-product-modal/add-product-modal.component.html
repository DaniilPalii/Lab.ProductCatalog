<app-modal
	title="Add Product"
	[(isVisible)]="isVisible"
	(submit)="submit()"
	(close)="close()"
>
	<form [formGroup]="form" (ngSubmit)="submit()">
		<input
			formControlName="code"
			placeholder="Code"
			required
		/>
		<input
			formControlName="name"
			placeholder="Name"
			required
		/>
		<input
			formControlName="price"
			type="number"
			placeholder="Price"
			required
		/>
		<button type="submit" [disabled]="isSaving()">
			{{ isSaving() ? 'Saving…' : 'Add' }}
		</button>

		@if (saveError()) {
			<p>{{ saveError() }}</p>
		}
	</form>
</app-modal>
